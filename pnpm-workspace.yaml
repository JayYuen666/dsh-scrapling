# 本地策略，根不下发也不改写（投影只动 catalog / overrides 两个映射）。
# 空映射就是「谁都不许跑安装脚本」：pnpm 12 认这个键（`pnpm config get allowBuilds` 在本仓
# 读出 `{}`），而本仓的依赖图里没有一枚包带 install/postinstall 脚本（扫 node_modules/.pnpm 的
# manifest 现量 0 处），rolldown / oxlint / oxfmt 走的都是各自平台的预编译产物。所以这里不是
# 「漏了要放行的包」；哪天真有包需要跑脚本，安装会红在 ERR_PNPM_IGNORED_BUILDS，那时往这张表里
# 加它的名字，而不是把整张表打开。
allowBuilds: {}
# 发布冷却刻意为 0：内部 @jayyuen66/* 与宿主族 rc 包必须发布后即时可装；第三方新版的供应链
# 缓冲由 catalog 与 overrides 的精确钉版承担，不靠时间窗。
minimumReleaseAge: 0
