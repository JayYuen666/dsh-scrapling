# OpenSSF Scorecard：供应链体检。
#
# 它查的正是本仓这一层关心的东西——脚本注入、token 权限、依赖是否钉版、分支保护是否
# 存在。结果同时进 code scanning 面板与 OpenSSF 公有 API（本仓是 public 仓）。
#
# publish_results 只在默认分支上有效：上传的身份由 OIDC 换得，所以要 id-token: write。
name: scorecard
on:
  # 分支保护/ruleset 变更时重跑，否则 Branch-Protection 这项检查只会停在旧值上。
  branch_protection_rule:
  # 手动入口：同上。注意下面的 if 要求「在默认分支上跑」，所以在功能分支上手跑时该 job
  # 会被跳过——这不是故障。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
# 组键按 ref 分：周度 cron 与 push / 手动触发落在同一 ref 上时，后一次取消前一次。
# 这个工作流的产物是「对当前那棵树的扫描结论」，旧那次的结果没有留存价值；而它同时向
# code scanning 与 OpenSSF 公共 API 发布，交错的两次会互相覆盖出不一致的数。
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true
# 工作流级全只读；两个写权限只挂在 analysis job 上。
permissions: read-all
jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results: true 只在默认分支生效，所以在非默认分支上不跑这条。
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write
      # job 级 permissions 一旦写了，没列出的项一律是 none，checkout 也就读不到仓库内容。
      # 这里显式补回来：它要的是读，与上面两项写权限不冲突。
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不让 checkout 把 token 留在 .git/config 里：后续步骤不该能借它推代码。
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
      # artifact 只是 5 天的留存副本，价值低于上面那一步；排在它前面时一次 artifact 失败
      # （配额、并发冲突、网络抖动）会让本轮扫描结果整条丢掉。
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
