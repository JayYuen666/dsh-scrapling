# Python 侧的静态检查：ruff（检查 + 格式）与 mypy（类型）。
#
# 为什么值得有：这四份 .py 是**随包发布**的（package.json 的 files 里逐份列着），
# 跑在用户的机器上。此前它们只有 py/tests/test_bridge.py 这一层运行时验证 —— 没有
# 类型检查、没有 lint、没有格式门禁，而代码里已经躺着 24 个 `# noqa:` 与 7 个
# `# pyright: ignore` 抑制标记，两个工具却一个都没配。那些标记于是成了没人校验的
# 死文档：该抑制的理由还在，但「不再需要抑制」与「新增一处违规」都没有人会知道。
# TypeScript 侧的 oxlint 明确开着 reportUnusedDisableDirectives: error，这一份配置
# 把同一件事补到 Python 侧。
#
# 装上再跑：pip install -r py/requirements-dev.txt
#   npm run lint:py      ruff check（进门禁）
#   npm run fmt:py       ruff format --check（进门禁）
#   npm run typecheck:py mypy（暂不进门禁，原因见 [tool.mypy]）
#   npm run cov:py       coverage（暂不进门禁，先知道缺口在哪）

[tool.ruff]
# 与仓库里中文注释的既成行宽对齐：TS 侧的 oxfmt 默认不重排注释，注释行普遍到 120。
# 收到 88 会逼着把 174 行中文注释全部重折，那与「检查有没有缺陷」无关。
line-length = 120
# README 声明的地板是 Python 3.10；lint 规则按这个地板选，避免 UP 一类规则把
# 3.10 用户直接修坏。
target-version = "py310"

[tool.ruff.lint]
select = [
  "F", # pyflakes：未使用的导入/变量、重复键、except 顺序
  "E", # pycodestyle 错误：含 E501 行宽
  "W", # pycodestyle 警告：行尾空白、过期比较
  "I", # import 排序
  "B", # bugbear：闭包捕获循环变量（B023）就在这一类里，实测抓到过真缺陷
  "SIM", # flake8-simplify： suppress 之类
  "RET", # flake8-return：return 前的多余赋值
  "BLE001", # 裸 except Exception —— 本仓库刻意保留既有 8 处带理由的抑制
  "PLW0603", # global 语句 —— 同理，抑制标记里写着「为什么可以」
  "S603", # subprocess 调用 —— 守卫读系统代理那一处参数全是本文件常量
  "N802", # 函数命名 —— BaseHTTPRequestHandler 的 do_GET 约定
  "E402", # 模块级 import 不在文件头 —— bridge.py 为避开循环依赖而内联导入
]

# ANN401 刻意不开：Playwright 的 page/route/websocket 全是运行时才知道形状的第三方对象，
# 代码对它们一律标 Any（guard.py 的 install 就有 28 处）。开这一条要加 25 处抑制，
# 收益为负 —— 那三处 `# noqa: ANN401` 因此已改成普通注释，把同样的理由留在原地。

[tool.mypy]
ignore_missing_imports = true
# 不设 warn_unused_ignores / disallow_untyped_defs 那一族：这一侧的 duck 类型是刻意
# 的（Playwright 对象、跨语言回包），严格档会逼出一堆只为进一步沉默而存在的 ignore。
# 因此 mypy 目前**不进门禁**：它报的是「标注与实现不一致」，不是编译失败。
python_version = "3.10"

[tool.coverage.run]
# 只量随包发布的那四份 + 测试脚本本身；__pycache__ 与 _env 一概不进。
source = ["py"]
parallel = true
# sidecar 是被 terminate 的：不收尾信号的话，它的数据文件不会落盘。
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = false
