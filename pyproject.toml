# Python 侧的静态检查：ruff（检查 + 格式）、mypy（类型）、bandit（安全）与 coverage（地板棘轮）。
#
# 为什么值得有：py/ 下随包发布的那几份 .py 列在 package.json 的 files 里，跑在用户的机器上。
# 配上这一段配置之前，它们只有 py/tests/test_bridge.py 一层运行时验证：没有类型检查、没有 lint、
# 没有格式门禁，而代码里已经躺着成片的 `# noqa:` 抑制标记。那些标记于是成了没人校验的死文档——
# 该抑制的理由还在，但「不再需要抑制」与「新增一处违规」都没人会知道。TypeScript 侧的 oxlint
# 明确开着 reportUnusedDisableDirectives: error，这一份配置把同一件事补到 Python 侧。
#
# 建解释器与环境：在伞根跑 pnpm py:setup（uv 建 _env/.venv 并装 py/requirements-dev.txt）。
#   npm run lint:py        ruff check
#   npm run fmt:py         ruff format --check
#   npm run typecheck:py   mypy
#   npm run bandit:py      bandit -q -r py/（全部 severity；误报用带理由的 # nosec）
#   npm run test:py        py/tests/test_bridge.py 端到端
#   npm run coverage:floor 覆盖率地板；cov:py 是"看缺口在哪"的报表面
# 以上全在 check:py 里，随 pnpm run check 进 CI。

[tool.ruff]
# 与仓库里中文注释的既成行宽对齐：TS 侧的 oxfmt 默认不重排注释，注释行普遍到 120。
# 收到更窄的行宽会逼着把全部中文注释重折，那与「检查有没有缺陷」无关。
line-length = 120
# 地板是 Python 3.14+：README 双语承诺、[tool.mypy] 的 python_version 与 py/bridge.py 的运行时硬闸
# 说的是同一件事。抬上来之后 ruff format 会按 PEP 758 去掉 except 元组的括号，那只有 3.14 解析得
# 了——所以改这一行必须同时跑一次 ruff format py/ 并把产物一并提交，否则 fmt:py 立刻红。
target-version = "py314"

[tool.ruff.lint]
select = [
  "F", # pyflakes：未使用的导入/变量、重复键、except 顺序
  "E", # pycodestyle 错误：含 E501 行宽
  "W", # pycodestyle 警告：行尾空白、过期比较
  "I", # import 排序
  "B", # bugbear：闭包捕获循环变量（B023）就在这一类里，实测抓到过真缺陷
  "SIM", # flake8-simplify： suppress 之类
  "RET", # flake8-return：return 前的多余赋值
  "BLE001", # 裸 except Exception —— 开着它，配合下面 RUF100：既有抑制都带理由，理由不再成立时标记本身判红
  "PLW0603", # global 语句 —— 同上；这一档的抑制标记里写着「为什么可以」
  "S", # flake8-bandit：安全类（含 S603 子进程调用）
  "N802", # 函数命名 —— BaseHTTPRequestHandler 的 do_GET 约定
  "E402", # 模块级 import 不在文件头 —— bridge.py 为避开循环依赖而内联导入
  "C90", # mccabe：函数复杂度
  "ANN", # flake8-annotations：注解完整性；ANN401 单列 ignore
  "RUF100", # 失效的 noqa：抑制理由还留着、但那条违规已经不在了（或那条规则压根没开）
]
ignore = ["ANN401"]

# 以当前最高复杂度为棘轮；新增函数不得更复杂，收紧前先拆现有函数。
[tool.ruff.lint.mccabe]
max-complexity = 28

# 上面 RUF100 是这段配置的兑现面：没有它，`# noqa` 会从「有人校验的断言」退化成「没人读的死文档」——
# 该抑制的理由还在，但「这条已经不需要抑制了」与「新加了一处违规」都不会让任何门变红。
# 它只判**指令有没有用**，不判理由写得对不对：理由已经改成普通注释，规则压根没开时就算失效。
# ANN401 刻意不开：Playwright 的 page/route/websocket 全是运行时才知道形状的第三方对象，
# 代码对它们一律标 Any。开这一条会把成片的既有标注判成违规、逼出一堆只为过门而写的抑制，
# 收益为负 —— 原先那批 `# noqa: ANN401` 因此改成普通注释，理由留在原地但不占着抑制标记。

[tool.mypy]
# 严格档：未注解的函数体也要查，失效的 type: ignore 与未注解 def 都判红。
# 解析不到的导入按下面的 [[tool.mypy.overrides]] 逐模块放行，不开全局开关：
# 全局 ignore_missing_imports 会把同级模块拼错（`import adapters` 打成 `adapterss`）也吞成 Any。
python_version = "3.14"
# 未注解的函数体也要查；失效的 type: ignore 与未注解 def 都判红。
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
# 分支也计入：本项目的风险面恰恰在错误/降级分支（SCRAPLING_MISSING、半帧与超时、Windows
# 路径分叉），只按行统计时未走到的 except/else 不会拉低读数。开启后现量最低的那份是
# py/bridge.py 与 py/extraction.py（81%），仍高于 coverage:floor 的地板，所以地板值不动。
branch = true
# 只量随包发布的源文件 + 测试脚本本身；__pycache__ 与 _env 一概不进。
source = ["py"]
parallel = true
# sidecar 是被 terminate 的：不收尾信号的话，它的数据文件不会落盘。
sigterm = true

[tool.coverage.report]
# 这一档不设 fail_under：地板由 package.json 的 coverage:floor 那条腿施加（它同时用
# --omit="py/tests/*" 把分母收在随包发布的源文件上），cov:py 是「看缺口在哪」的报表面，
# 不该因为一次探查就判红。两处地板取值不一致时由 coverage-floor.mjs 判红，不靠人记。
show_missing = true
skip_covered = false

# 只对确实没有类型桩的第三方按模块放行：全局 ignore_missing_imports 会把 py/ 里拼错的、
# 被删掉的或改了名的一等公民导入（`import adapters` 这类同级模块）一起吞成 Any，
# 而那正是类型门禁该抓的东西。实测 14 份源文件里只有两处需要这一条 —— scrapling、
# playwright、curl_cffi 都自带 py.typed，mypy 直接解析得开，把它们列进来只是死配置；
# `lxml` 没有桩；`redis` 是 adaptive-redis 能力包的运行期依赖，dev 环境不装它
# （CI 只装 scrapling[rag] 与 requirements-dev），缺它时 py/redis_storage.py 的按需导入按 Any 处理。
[[tool.mypy.overrides]]
module = ["lxml.*", "redis", "redis.*"]
ignore_missing_imports = true
